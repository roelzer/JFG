name: Diagnose Vereinsspiele (temporär)
on:
  push:
    paths: ['.github/workflows/diag.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          C=016G94T91K000000VV0AG80NVUNAS2C2
          for p in naechste letzte; do
            echo "=================== $p"
            curl -sS -m 20 -A "Mozilla/5.0" "https://www.bfv.de/partial/vereinsprofil/spielplan/$C/$p" -o $p.html
            wc -c $p.html
            # Text ohne Tags, kompakt
            sed -e 's/<[^>]*>/ /g' $p.html | tr -s ' \n\t' ' ' | fold -w 220 | head -60
            echo; echo "--- Links"
            grep -oE 'href="[^"]*"' $p.html | sort -u | head -40
            echo "--- erste 2500 Zeichen Roh-HTML"
            head -c 2500 $p.html; echo
          done
          echo "=================== Mannschaftsliste"
          curl -sS -m 20 -A "Mozilla/5.0" "https://www.bfv.de/partial/vereinsprofil/mannschaftsliste/$C" | grep -oE 'href="/mannschaften/[^"]*"' | sort -u
